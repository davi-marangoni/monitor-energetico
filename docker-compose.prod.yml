version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitor_energetico_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-monitor_energetico}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitor_network

  api:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile
    container_name: monitor_energetico_api_prod
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME:-monitor_energetico}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - api_static:/app/api/staticfiles
      - api_media:/app/api/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitor_network

  nginx:
    image: nginx:alpine
    container_name: monitor_energetico_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - api_static:/app/api/staticfiles:ro
      - api_media:/app/api/media:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - monitor_network

volumes:
  postgres_data_prod:
    driver: local
  api_static:
    driver: local
  api_media:
    driver: local

networks:
  monitor_network:
    driver: bridge
