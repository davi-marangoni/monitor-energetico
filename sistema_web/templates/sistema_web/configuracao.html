{% extends "sistema_web/base.html" %}
{% block conteudo %}
<h2>Configuração energética - {{ maquina.hostname }}</h2>
<form method="post">
  {% csrf_token %}
  <label>TDP CPU (W): <input type="number" step="0.01" name="tdp_cpu_watts" value="{{ atual.tdp_cpu_watts|default:'65' }}" required></label><br>
  <label>Fator idle (α): <input type="number" step="0.0001" name="fator_idle_alpha" value="{{ atual.fator_idle_alpha|default:'0.2' }}" required></label><br>
  <label>Consumo RAM por GB: <input type="number" step="0.0001" name="consumo_ram_por_gb" value="{{ atual.consumo_ram_por_gb|default:'0.3' }}" required></label><br>
  <button type="submit">Salvar</button>
</form>
{% endblock %}
