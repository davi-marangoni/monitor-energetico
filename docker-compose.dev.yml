version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitor_energetico_postgres_dev
    environment:
      POSTGRES_DB: monitor_energetico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile
    container_name: monitor_energetico_api_dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-development-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DB_NAME: monitor_energetico
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000"
    volumes:
      - ./api:/app/api
      - ./sistema_web/templates:/app/api/templates
      - ./sistema_web/static:/app/api/static
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
    driver: local
